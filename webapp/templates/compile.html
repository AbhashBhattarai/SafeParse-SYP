{% extends "base.html" %}
{% block title %}Compile — SafeParse Demo{% endblock %}
{% block content %}
<div class="card">
    <h2>Compile a Format Specification</h2>
    <p><em>Demo mode: input is read-only. Compiler is not connected.</em></p>

    <div class="form-group">
        <label for="spec_text">Format Specification (read-only)</label>
        <textarea id="spec_text" name="spec_text" rows="8" readonly
                  style="width:100%;font-family:monospace;">{{ spec_text }}</textarea>
    </div>

    <div class="form-group" style="margin-top:20px;">
        <label>Static sample output — not live output</label>
        <pre style="background:#f4f4f4;padding:12px;border-radius:4px;overflow:auto;">{{ udp_header_excerpt }}</pre>
    </div>
</div>
{% endblock %}
